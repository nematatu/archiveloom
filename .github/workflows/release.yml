name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: archiveloom-linux
            binary_name: archiveloom-linux
            executable: dist/archiveloom-linux
          - os: macos-latest
            artifact: archiveloom-macos
            binary_name: archiveloom-macos
            executable: dist/archiveloom-macos
          - os: windows-latest
            artifact: archiveloom-windows
            binary_name: archiveloom-windows
            executable: dist/archiveloom-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pyinstaller --clean --onefile --name ${{ matrix.binary_name }} src/archiveloom/__main__.py
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}
          if-no-files-found: error

  publish-github:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/**/* --generate-notes --verify-tag --prerelease
