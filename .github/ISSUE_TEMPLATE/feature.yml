name: Feature request
description: Suggest a generic ArchiveLoom improvement.
title: "feature: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible result, including failure and cancellation behavior.
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platform scope
      multiple: true
      options: [macOS, Windows, Linux, All platforms]
    validations:
      required: true
