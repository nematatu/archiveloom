changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: Breaking changes
      labels: ["breaking"]
    - title: New features
      labels: ["enhancement"]
    - title: Site adapters
      labels: ["adapter"]
    - title: Fixes
      labels: ["bug"]
    - title: Documentation and maintenance
      labels: ["documentation", "dependencies"]
    - title: Other changes
      labels: ["*"]
