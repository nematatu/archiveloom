[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "archiveloom"
version = "0.1.0"
description = "A safe, adapter-driven bulk media archiver for the open web"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "nematatu" }]
keywords = ["archive", "download", "hls", "media", "cli", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "filelock>=3.29,<4",
  "httpx>=0.28,<0.29",
  "rich>=14.3,<16",
  "textual>=7,<9",
  "typer>=0.24,<0.28",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "hatchling>=1.27,<2",
  "mypy>=1.18,<2",
  "pre-commit>=4.3,<5",
  "pyinstaller>=6.16,<7",
  "pytest>=8.4,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]
docs = [
  "mkdocs-material>=9.7,<10",
]

[project.scripts]
archiveloom = "archiveloom.cli:app"

[project.entry-points."archiveloom.adapters"]
direct = "archiveloom.adapters.direct:DirectAdapter"
gofile = "archiveloom.adapters.gofile:GofileAdapter"
manifest = "archiveloom.adapters.manifest:ManifestAdapter"
tweetfile = "archiveloom.adapters.tweetfile:TweetFileAdapter"

[project.urls]
Homepage = "https://github.com/nematatu/archiveloom"
Documentation = "https://github.com/nematatu/archiveloom/tree/main/docs"
Issues = "https://github.com/nematatu/archiveloom/issues"
Source = "https://github.com/nematatu/archiveloom"

[tool.hatch.build.targets.wheel]
packages = ["src/archiveloom"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["archiveloom"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["archiveloom"]
warn_unused_configs = true
